name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dry-run output is never committed (it holds real staff data)
        run: test -z "$(git ls-files out)"
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Tests use an in-process Postgres (PGlite) — no database service needed.
      - run: pnpm run test
      - name: Migrations match the schema
        run: |
          pnpm run db:generate
          git diff --exit-code migrations || (echo "::error::src/db/schema.ts changed without a generated migration — run pnpm db:generate and commit it" && exit 1)
          test -z "$(git status --porcelain migrations)"
